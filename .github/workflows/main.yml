name: Run Client Script

on: [push]

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Read Python Version
        id: python_version
        run: |
          echo "::set-output name=version::$(cat runtime.txt)"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.python_version.outputs.version }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Script
        env:
          TOKEN: ${{ secrets.TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          JOB_KEY: ${{ secrets.JOBS_KEY }}
          CHANNEL_ID1: ${{ secrets.CHANNEL_ID1 }}
          CHANNEL_ID2: ${{ secrets.CHANNEL_ID2 }}
        run: |
          python -m unittest tests.test
